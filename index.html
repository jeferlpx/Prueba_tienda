<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Login y Registro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Contenedor de notificaciones globales -->
    <div id="notification" class="notification hidden"></div>

    <div class="login-container" id="container">
        <!-- =================== LOGIN SECTION =================== -->
        <div id="loginSection" class="form-section">
            <div class="login-header">
                <h2>Bienvenido</h2>
                <p>Ingresa a tu cuenta para continuar</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <i class="fa-regular fa-envelope icon"></i>
                    <input type="text" id="email" name="username" required autocomplete="username">
                    <label for="email">Correo Electrónico / Usuario</label>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <label for="password">Contraseña</label>
                    <i class="fa-regular fa-eye-slash toggle-password" data-target="password"></i>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span class="checkmark"></span>
                        Recordarme
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">
                    <span class="btn-text">Iniciar Sesión</span>
                    <div class="loader"></div>
                </button>
            </form>

            <div class="login-footer">
                <p>¿No tienes una cuenta? <a href="#" id="showRegister">Regístrate</a></p>
            </div>
        </div>

        <!-- =================== REGISTER SECTION =================== -->
        <div id="registerSection" class="form-section hidden">
            <div class="login-header">
                <h2>Crear Cuenta</h2>
                <p>Únete para comenzar</p>
            </div>

            <form id="registerForm" class="login-form">
                <div class="input-group">
                    <i class="fa-regular fa-user icon"></i>
                    <input type="text" id="regName" name="name" required autocomplete="name">
                    <label for="regName">Nombre Completo</label>
                </div>

                <div class="input-group">
                    <i class="fa-regular fa-envelope icon"></i>
                    <input type="email" id="regEmail" name="username" required autocomplete="username">
                    <label for="regEmail">Correo Electrónico</label>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="regPassword" name="password" required autocomplete="new-password">
                    <label for="regPassword">Contraseña</label>
                    <i class="fa-regular fa-eye-slash toggle-password" data-target="regPassword"></i>
                </div>

                <button type="submit" id="regSubmitBtn" class="submit-btn" style="margin-top: 20px;">
                    <span class="btn-text">Registrarse</span>
                    <div class="loader"></div>
                </button>
            </form>

            <div class="login-footer">
                <p>¿Ya tienes una cuenta? <a href="#" id="showLogin">Inicia Sesión</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
